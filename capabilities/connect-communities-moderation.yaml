naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce Connect REST API (Communities) — Moderation
  description: 'Salesforce Experience Cloud Salesforce Connect REST API (Communities) — Moderation. 1 operations. Lead operation:
    Salesforce Experience Cloud Get Flagged Elements. Self-contained Naftiko capability covering one Salesforce Experience
    Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Moderation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-communities-moderation
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect
    description: Salesforce Experience Cloud Salesforce Connect REST API (Communities) — Moderation business capability. Self-contained,
      no shared references.
    resources:
    - name: communities-communityId-moderation-flagged-elements
      path: /communities/{communityId}/moderation/flagged-elements
      operations:
      - name: getflaggedelements
        method: GET
        description: Salesforce Experience Cloud Get Flagged Elements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: visibility
          in: query
          type: string
          description: Filter by flagged element visibility
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-communities-moderation-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce Connect REST API (Communities) — Moderation. One
      Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/communities/{communityid}/moderation/flagged-elements
      name: communities-communityid-moderation-flagged-elements
      description: REST surface for communities-communityId-moderation-flagged-elements.
      operations:
      - method: GET
        name: getflaggedelements
        description: Salesforce Experience Cloud Get Flagged Elements
        call: connect-communities-moderation.getflaggedelements
        with:
          visibility: rest.visibility
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-communities-moderation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce Connect REST API (Communities) — Moderation. One tool
      per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-get-flagged
      description: Salesforce Experience Cloud Get Flagged Elements
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-communities-moderation.getflaggedelements
      with:
        visibility: tools.visibility
      outputParameters:
      - type: object
        mapping: $.
