naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce CMS Connect API — Content Types
  description: 'Salesforce Experience Cloud Salesforce CMS Connect API — Content Types. 1 operations. Lead operation: Salesforce
    Experience Cloud List Content Types. Self-contained Naftiko capability covering one Salesforce Experience Cloud business
    surface.'
  tags:
  - Salesforce Experience Cloud
  - Content Types
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: cms-connect-content-types
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect/cms
    description: Salesforce Experience Cloud Salesforce CMS Connect API — Content Types business capability. Self-contained,
      no shared references.
    resources:
    - name: content-types
      path: /content-types
      operations:
      - name: listcontenttypes
        method: GET
        description: Salesforce Experience Cloud List Content Types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: cms-connect-content-types-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce CMS Connect API — Content Types. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/content-types
      name: content-types
      description: REST surface for content-types.
      operations:
      - method: GET
        name: listcontenttypes
        description: Salesforce Experience Cloud List Content Types
        call: cms-connect-content-types.listcontenttypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cms-connect-content-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce CMS Connect API — Content Types. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-list-content
      description: Salesforce Experience Cloud List Content Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cms-connect-content-types.listcontenttypes
      outputParameters:
      - type: object
        mapping: $.
