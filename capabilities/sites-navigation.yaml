naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Sites API — Navigation
  description: 'Salesforce Experience Cloud Sites API — Navigation. 1 operations. Lead operation: Salesforce Experience Cloud
    Get Navigation Menu Items. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Navigation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-navigation
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Sites API — Navigation business capability. Self-contained, no shared references.
    resources:
    - name: connect-communities-communityId-navigation-menu-navigation-menu-items
      path: /connect/communities/{communityId}/navigation-menu/navigation-menu-items
      operations:
      - name: getnavigationmenuitems
        method: GET
        description: Salesforce Experience Cloud Get Navigation Menu Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: navigationLinkSetId
          in: query
          type: string
          description: The ID of the navigation link set to retrieve
        - name: menuItemTypesToSkip
          in: query
          type: string
          description: Comma-separated list of menu item types to exclude
        - name: publishStatus
          in: query
          type: string
          description: Filter by publish status of the navigation menu
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-navigation-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Sites API — Navigation. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/connect/communities/{communityid}/navigation-menu/navigation-menu-items
      name: connect-communities-communityid-navigation-menu-navigation-menu-items
      description: REST surface for connect-communities-communityId-navigation-menu-navigation-menu-items.
      operations:
      - method: GET
        name: getnavigationmenuitems
        description: Salesforce Experience Cloud Get Navigation Menu Items
        call: sites-navigation.getnavigationmenuitems
        with:
          navigationLinkSetId: rest.navigationLinkSetId
          menuItemTypesToSkip: rest.menuItemTypesToSkip
          publishStatus: rest.publishStatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-navigation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Sites API — Navigation. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-get-navigation
      description: Salesforce Experience Cloud Get Navigation Menu Items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-navigation.getnavigationmenuitems
      with:
        navigationLinkSetId: tools.navigationLinkSetId
        menuItemTypesToSkip: tools.menuItemTypesToSkip
        publishStatus: tools.publishStatus
      outputParameters:
      - type: object
        mapping: $.
