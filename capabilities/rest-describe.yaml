naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce REST API — Describe
  description: 'Salesforce Experience Cloud Salesforce REST API — Describe. 2 operations. Lead operation: Salesforce Experience
    Cloud Describe Global. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Describe
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-describe
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Salesforce REST API — Describe business capability. Self-contained, no shared
      references.
    resources:
    - name: sobjects
      path: /sobjects
      operations:
      - name: describeglobal
        method: GET
        description: Salesforce Experience Cloud Describe Global
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: If-Modified-Since
          in: header
          type: string
          description: Return objects modified since this date
    - name: sobjects-sObjectName-describe
      path: /sobjects/{sObjectName}/describe
      operations:
      - name: describesobject
        method: GET
        description: Salesforce Experience Cloud Describe an sObject
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: If-Modified-Since
          in: header
          type: string
          description: Return describe only if modified since this date
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-describe-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce REST API — Describe. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sobjects
      name: sobjects
      description: REST surface for sobjects.
      operations:
      - method: GET
        name: describeglobal
        description: Salesforce Experience Cloud Describe Global
        call: rest-describe.describeglobal
        with:
          If-Modified-Since: rest.If-Modified-Since
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sobjects/{sobjectname}/describe
      name: sobjects-sobjectname-describe
      description: REST surface for sobjects-sObjectName-describe.
      operations:
      - method: GET
        name: describesobject
        description: Salesforce Experience Cloud Describe an sObject
        call: rest-describe.describesobject
        with:
          If-Modified-Since: rest.If-Modified-Since
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-describe-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce REST API — Describe. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-describe-global
      description: Salesforce Experience Cloud Describe Global
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-describe.describeglobal
      with:
        If-Modified-Since: tools.If-Modified-Since
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-describe-sobject
      description: Salesforce Experience Cloud Describe an sObject
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-describe.describesobject
      with:
        If-Modified-Since: tools.If-Modified-Since
      outputParameters:
      - type: object
        mapping: $.
