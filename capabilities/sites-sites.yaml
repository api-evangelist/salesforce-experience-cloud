naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Sites API — Sites
  description: 'Salesforce Experience Cloud Sites API — Sites. 4 operations. Lead operation: Salesforce Experience Cloud List
    Experience Cloud Sites. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Sites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-sites
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Sites API — Sites business capability. Self-contained, no shared references.
    resources:
    - name: connect-communities
      path: /connect/communities
      operations:
      - name: listexperiencecloudsites
        method: GET
        description: Salesforce Experience Cloud List Experience Cloud Sites
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createexperiencecloudsite
        method: POST
        description: Salesforce Experience Cloud Create an Experience Cloud Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: connect-communities-communityId
      path: /connect/communities/{communityId}
      operations:
      - name: getexperiencecloudsite
        method: GET
        description: Salesforce Experience Cloud Get an Experience Cloud Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateexperiencecloudsite
        method: PATCH
        description: Salesforce Experience Cloud Update an Experience Cloud Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-sites-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Sites API — Sites. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/connect/communities
      name: connect-communities
      description: REST surface for connect-communities.
      operations:
      - method: GET
        name: listexperiencecloudsites
        description: Salesforce Experience Cloud List Experience Cloud Sites
        call: sites-sites.listexperiencecloudsites
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createexperiencecloudsite
        description: Salesforce Experience Cloud Create an Experience Cloud Site
        call: sites-sites.createexperiencecloudsite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connect/communities/{communityid}
      name: connect-communities-communityid
      description: REST surface for connect-communities-communityId.
      operations:
      - method: GET
        name: getexperiencecloudsite
        description: Salesforce Experience Cloud Get an Experience Cloud Site
        call: sites-sites.getexperiencecloudsite
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateexperiencecloudsite
        description: Salesforce Experience Cloud Update an Experience Cloud Site
        call: sites-sites.updateexperiencecloudsite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-sites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Sites API — Sites. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-list-experience
      description: Salesforce Experience Cloud List Experience Cloud Sites
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-sites.listexperiencecloudsites
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-create-experience
      description: Salesforce Experience Cloud Create an Experience Cloud Site
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sites-sites.createexperiencecloudsite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-get-experience
      description: Salesforce Experience Cloud Get an Experience Cloud Site
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-sites.getexperiencecloudsite
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-update-experience
      description: Salesforce Experience Cloud Update an Experience Cloud Site
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sites-sites.updateexperiencecloudsite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
