naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Sites API — Themes
  description: 'Salesforce Experience Cloud Sites API — Themes. 1 operations. Lead operation: Salesforce Experience Cloud
    Get Site Themes. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Themes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-themes
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Sites API — Themes business capability. Self-contained, no shared references.
    resources:
    - name: connect-communities-communityId-themes
      path: /connect/communities/{communityId}/themes
      operations:
      - name: getsitethemes
        method: GET
        description: Salesforce Experience Cloud Get Site Themes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-themes-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Sites API — Themes. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/connect/communities/{communityid}/themes
      name: connect-communities-communityid-themes
      description: REST surface for connect-communities-communityId-themes.
      operations:
      - method: GET
        name: getsitethemes
        description: Salesforce Experience Cloud Get Site Themes
        call: sites-themes.getsitethemes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-themes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Sites API — Themes. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-get-site
      description: Salesforce Experience Cloud Get Site Themes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sites-themes.getsitethemes
      outputParameters:
      - type: object
        mapping: $.
