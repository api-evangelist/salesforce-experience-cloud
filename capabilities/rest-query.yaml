naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce REST API — Query
  description: 'Salesforce Experience Cloud Salesforce REST API — Query. 3 operations. Lead operation: Salesforce Experience
    Cloud Execute a SOQL Query. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-query
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Salesforce REST API — Query business capability. Self-contained, no shared references.
    resources:
    - name: query
      path: /query
      operations:
      - name: executequery
        method: GET
        description: Salesforce Experience Cloud Execute a SOQL Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The SOQL query string to execute
          required: true
    - name: query-queryLocator
      path: /query/{queryLocator}
      operations:
      - name: getnextquerypage
        method: GET
        description: Salesforce Experience Cloud Get Next Page of Query Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: queryLocator
          in: path
          type: string
          description: Query locator from the previous query result
          required: true
    - name: queryAll
      path: /queryAll
      operations:
      - name: executequeryall
        method: GET
        description: Salesforce Experience Cloud Execute a SOQL Query Including Deleted Records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The SOQL query string to execute
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-query-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce REST API — Query. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/query
      name: query
      description: REST surface for query.
      operations:
      - method: GET
        name: executequery
        description: Salesforce Experience Cloud Execute a SOQL Query
        call: rest-query.executequery
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/query/{querylocator}
      name: query-querylocator
      description: REST surface for query-queryLocator.
      operations:
      - method: GET
        name: getnextquerypage
        description: Salesforce Experience Cloud Get Next Page of Query Results
        call: rest-query.getnextquerypage
        with:
          queryLocator: rest.queryLocator
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queryall
      name: queryall
      description: REST surface for queryAll.
      operations:
      - method: GET
        name: executequeryall
        description: Salesforce Experience Cloud Execute a SOQL Query Including Deleted Records
        call: rest-query.executequeryall
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce REST API — Query. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-execute-soql
      description: Salesforce Experience Cloud Execute a SOQL Query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-query.executequery
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-get-next
      description: Salesforce Experience Cloud Get Next Page of Query Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-query.getnextquerypage
      with:
        queryLocator: tools.queryLocator
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-execute-soql-2
      description: Salesforce Experience Cloud Execute a SOQL Query Including Deleted Records
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-query.executequeryall
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
