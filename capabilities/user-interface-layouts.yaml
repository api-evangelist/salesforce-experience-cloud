naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce User Interface API — Layouts
  description: 'Salesforce Experience Cloud Salesforce User Interface API — Layouts. 1 operations. Lead operation: Salesforce
    Experience Cloud Get Record Layout. Self-contained Naftiko capability covering one Salesforce Experience Cloud business
    surface.'
  tags:
  - Salesforce Experience Cloud
  - Layouts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: user-interface-layouts
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/ui-api
    description: Salesforce Experience Cloud Salesforce User Interface API — Layouts business capability. Self-contained,
      no shared references.
    resources:
    - name: layout-objectApiName
      path: /layout/{objectApiName}
      operations:
      - name: getrecordlayout
        method: GET
        description: Salesforce Experience Cloud Get Record Layout
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: formFactor
          in: query
          type: string
          description: Form factor for the layout
        - name: layoutType
          in: query
          type: string
          description: Type of layout to retrieve
        - name: mode
          in: query
          type: string
          description: Mode for the layout
        - name: recordTypeId
          in: query
          type: string
          description: Record type ID for the layout
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: user-interface-layouts-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce User Interface API — Layouts. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/layout/{objectapiname}
      name: layout-objectapiname
      description: REST surface for layout-objectApiName.
      operations:
      - method: GET
        name: getrecordlayout
        description: Salesforce Experience Cloud Get Record Layout
        call: user-interface-layouts.getrecordlayout
        with:
          formFactor: rest.formFactor
          layoutType: rest.layoutType
          mode: rest.mode
          recordTypeId: rest.recordTypeId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: user-interface-layouts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce User Interface API — Layouts. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-get-record
      description: Salesforce Experience Cloud Get Record Layout
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: user-interface-layouts.getrecordlayout
      with:
        formFactor: tools.formFactor
        layoutType: tools.layoutType
        mode: tools.mode
        recordTypeId: tools.recordTypeId
      outputParameters:
      - type: object
        mapping: $.
