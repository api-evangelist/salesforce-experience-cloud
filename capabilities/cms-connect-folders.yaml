naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce CMS Connect API — Folders
  description: 'Salesforce Experience Cloud Salesforce CMS Connect API — Folders. 1 operations. Lead operation: Salesforce
    Experience Cloud List CMS Folders. Self-contained Naftiko capability covering one Salesforce Experience Cloud business
    surface.'
  tags:
  - Salesforce Experience Cloud
  - Folders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: cms-connect-folders
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect/cms
    description: Salesforce Experience Cloud Salesforce CMS Connect API — Folders business capability. Self-contained, no
      shared references.
    resources:
    - name: folders
      path: /folders
      operations:
      - name: listcmsfolders
        method: GET
        description: Salesforce Experience Cloud List CMS Folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: cms-connect-folders-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce CMS Connect API — Folders. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/folders
      name: folders
      description: REST surface for folders.
      operations:
      - method: GET
        name: listcmsfolders
        description: Salesforce Experience Cloud List CMS Folders
        call: cms-connect-folders.listcmsfolders
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cms-connect-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce CMS Connect API — Folders. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-list-cms
      description: Salesforce Experience Cloud List CMS Folders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cms-connect-folders.listcmsfolders
      outputParameters:
      - type: object
        mapping: $.
