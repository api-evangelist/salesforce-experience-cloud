naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Sites API — Publish
  description: 'Salesforce Experience Cloud Sites API — Publish. 1 operations. Lead operation: Salesforce Experience Cloud
    Publish an Experience Cloud Site. Self-contained Naftiko capability covering one Salesforce Experience Cloud business
    surface.'
  tags:
  - Salesforce Experience Cloud
  - Publish
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: sites-publish
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Sites API — Publish business capability. Self-contained, no shared references.
    resources:
    - name: connect-communities-communityId-publish
      path: /connect/communities/{communityId}/publish
      operations:
      - name: publishexperiencecloudsite
        method: POST
        description: Salesforce Experience Cloud Publish an Experience Cloud Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: sites-publish-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Sites API — Publish. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/connect/communities/{communityid}/publish
      name: connect-communities-communityid-publish
      description: REST surface for connect-communities-communityId-publish.
      operations:
      - method: POST
        name: publishexperiencecloudsite
        description: Salesforce Experience Cloud Publish an Experience Cloud Site
        call: sites-publish.publishexperiencecloudsite
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sites-publish-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Sites API — Publish. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-publish-experience
      description: Salesforce Experience Cloud Publish an Experience Cloud Site
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sites-publish.publishexperiencecloudsite
      outputParameters:
      - type: object
        mapping: $.
