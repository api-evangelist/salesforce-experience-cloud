        idempotent: true
      call: cms-connect-content.deletecmscontent
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-publish-cms
      description: Salesforce Experience Cloud Publish CMS Content
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cms-connect-content.publishcmscontent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-unpublish-cms
      description: Salesforce Experience Cloud Unpublish CMS Content
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cms-connect-content.unpublishcmscontent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
