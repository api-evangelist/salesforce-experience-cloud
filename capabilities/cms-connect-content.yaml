        destructive: false
        idempotent: false
      call: cms-connect-content.createcmscontent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-get-cms
      description: Salesforce Experience Cloud Get CMS Content
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cms-connect-content.getcmscontent
      with:
        language: tools.language
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-update-cms
      description: Salesforce Experience Cloud Update CMS Content
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cms-connect-content.updatecmscontent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-delete-cms
