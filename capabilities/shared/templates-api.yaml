naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Experience Cloud Templates API"
  description: >-
    Retrieve and manage Experience Cloud site templates including Build Your Own
    and Microsite LWR templates. Supports programmatic theme and branding
    configuration for digital experience portals.
  tags:
    - Branding
    - Design
    - LWR
    - Salesforce Experience Cloud
    - Templates
    - Themes
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: exp-cloud-templates
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0"
      description: "Salesforce Experience Cloud Templates and Themes API."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: templates
          path: /connect/communities/templates
          description: "Experience Cloud site templates."
          operations:
            - name: list-site-templates
              method: GET
              description: "List available Experience Cloud site templates."
              inputParameters:
                - name: templateCategory
                  in: query
                  type: string
                  required: false
                  description: "Filter templates by category (LWR, Aura, All)."
              outputRawFormat: json
              outputParameters:
                - name: templates
                  type: object
                  value: "$."

        - name: themes
          path: /connect/communities/{communityId}/themes
          description: "Site theme configuration."
          operations:
            - name: list-themes
              method: GET
              description: "List themes available for an Experience Cloud site."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: themes
                  type: object
                  value: "$."
            - name: get-active-theme
              method: GET
              description: "Get the active theme for an Experience Cloud site."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: theme
                  type: object
                  value: "$."
            - name: update-theme
              method: PATCH
              description: "Update the active theme for a site."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: theme
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  activeThemeName: "{{tools.activeThemeName}}"

        - name: branding-sets
          path: /connect/communities/{communityId}/branding-sets
          description: "Site branding set management."
          operations:
            - name: list-branding-sets
              method: GET
              description: "List branding sets for an Experience Cloud site."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: brandingSets
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8111
      namespace: exp-cloud-templates-api
      resources:
        - path: /v1/templates
          name: templates
          operations:
            - method: GET
              name: list-site-templates
              description: "List available Experience Cloud site templates."
              call: "exp-cloud-templates.list-site-templates"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/sites/{communityId}/themes
          name: themes
          operations:
            - method: GET
              name: list-themes
              description: "List available themes for a site."
              call: "exp-cloud-templates.list-themes"
              with:
                communityId: "rest.communityId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9111
      namespace: exp-cloud-templates-mcp
      transport: http
      tools:
        - name: list-experience-cloud-templates
          description: "List all available Experience Cloud site templates (LWR, Aura, etc.)."
          hints:
            readOnly: true
            idempotent: true
          call: "exp-cloud-templates.list-site-templates"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-site-themes
          description: "List available themes for an Experience Cloud site."
          hints:
            readOnly: true
            idempotent: true
          call: "exp-cloud-templates.list-themes"
          with:
            communityId: "tools.communityId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-site-theme
          description: "Update the active theme for an Experience Cloud site."
          hints:
            readOnly: false
            destructive: false
          call: "exp-cloud-templates.update-theme"
          with:
            communityId: "tools.communityId"
          outputParameters:
            - type: object
              mapping: "$."
