naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Experience Cloud CMS Connect API"
  description: >-
    API for managing CMS content, channels, folders, and media within
    Salesforce Experience Cloud. Create, publish, and manage content types.
  tags:
    - Channels
    - CMS
    - Content Management
    - Headless CMS
    - Media
    - Salesforce Experience Cloud
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: exp-cloud-cms
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0/connect/cms"
      description: "Salesforce CMS Connect API for content management."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: channels
          path: /channels
          description: "CMS content delivery channels."
          operations:
            - name: list-channels
              method: GET
              description: "List all CMS channels."
              outputRawFormat: json
              outputParameters:
                - name: channels
                  type: object
                  value: "$."
            - name: get-channel
              method: GET
              description: "Get a CMS channel by ID."
              inputParameters:
                - name: channelId
                  in: path
                  type: string
                  required: true
                  description: "CMS channel ID."
              outputRawFormat: json
              outputParameters:
                - name: channel
                  type: object
                  value: "$."

        - name: contents
          path: /contents
          description: "CMS content items."
          operations:
            - name: list-contents
              method: GET
              description: "List CMS content items."
              outputRawFormat: json
              outputParameters:
                - name: contents
                  type: object
                  value: "$."
            - name: create-content
              method: POST
              description: "Create a new CMS content item."
              outputRawFormat: json
              outputParameters:
                - name: content
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  contentType: "{{tools.contentType}}"
                  body: "{{tools.body}}"
            - name: get-content
              method: GET
              description: "Get a CMS content item by ID."
              inputParameters:
                - name: contentId
                  in: path
                  type: string
                  required: true
                  description: "Content ID."
              outputRawFormat: json
              outputParameters:
                - name: content
                  type: object
                  value: "$."
            - name: update-content
              method: PATCH
              description: "Update a CMS content item."
              inputParameters:
                - name: contentId
                  in: path
                  type: string
                  required: true
                  description: "Content ID."
              outputRawFormat: json
              outputParameters:
                - name: content
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  body: "{{tools.body}}"
            - name: publish-content
              method: POST
              description: "Publish a CMS content item."
              inputParameters:
                - name: contentId
                  in: path
                  type: string
                  required: true
                  description: "Content ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8106
      namespace: exp-cloud-cms-api
      resources:
        - path: /v1/channels
          name: cms-channels
          operations:
            - method: GET
              name: list-channels
              description: "List CMS channels."
              call: "exp-cloud-cms.list-channels"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/contents
          name: cms-contents
          operations:
            - method: GET
              name: list-contents
              description: "List CMS content items."
              call: "exp-cloud-cms.list-contents"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-content
              description: "Create CMS content."
              call: "exp-cloud-cms.create-content"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9106
      namespace: exp-cloud-cms-mcp
      transport: http
      tools:
        - name: list-cms-channels
          description: "List all CMS channels in Salesforce Experience Cloud."
          hints:
            readOnly: true
            idempotent: true
          call: "exp-cloud-cms.list-channels"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-cms-content
          description: "List CMS content items."
          hints:
            readOnly: true
            idempotent: true
          call: "exp-cloud-cms.list-contents"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-cms-content
          description: "Create a new CMS content item for a channel."
          hints:
            readOnly: false
            destructive: false
          call: "exp-cloud-cms.create-content"
          outputParameters:
            - type: object
              mapping: "$."
        - name: publish-cms-content
          description: "Publish a CMS content item to make it live."
          hints:
            readOnly: false
            destructive: false
          call: "exp-cloud-cms.publish-content"
          with:
            contentId: "tools.contentId"
          outputParameters:
            - type: object
              mapping: "$."
