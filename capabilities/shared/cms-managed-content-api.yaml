naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce CMS Managed Content API"
  description: >-
    Retrieve and search published managed content versions for Experience Cloud
    sites. Provides endpoints for querying managed content delivery channels
    and searching content across CMS workspaces.
  tags:
    - CMS
    - Content Management
    - Digital Experiences
    - Managed Content
    - Salesforce Experience Cloud
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: cms-managed-content
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0/connect"
      description: "Salesforce CMS Managed Content API."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: delivery-channels
          path: /cms/delivery/channels
          description: "Managed content delivery channels."
          operations:
            - name: list-delivery-channels
              method: GET
              description: "List managed content delivery channels."
              outputRawFormat: json
              outputParameters:
                - name: channels
                  type: object
                  value: "$."
            - name: get-delivery-channel
              method: GET
              description: "Get a specific delivery channel."
              inputParameters:
                - name: channelId
                  in: path
                  type: string
                  required: true
                  description: "Channel ID."
              outputRawFormat: json
              outputParameters:
                - name: channel
                  type: object
                  value: "$."
            - name: query-channel-content
              method: GET
              description: "Query managed content from a delivery channel."
              inputParameters:
                - name: channelId
                  in: path
                  type: string
                  required: true
                  description: "Channel ID."
                - name: managedContentType
                  in: query
                  type: string
                  required: false
                  description: "Content type developer name."
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "Language code."
              outputRawFormat: json
              outputParameters:
                - name: content
                  type: object
                  value: "$."

        - name: cms-content-search
          path: /cms/contents
          description: "Search managed content across workspaces."
          operations:
            - name: search-managed-content
              method: GET
              description: "Search published managed content by type and workspace."
              inputParameters:
                - name: managedContentType
                  in: query
                  type: string
                  required: false
                  description: "Filter by content type."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search term."
              outputRawFormat: json
              outputParameters:
                - name: searchResults
                  type: object
                  value: "$."
            - name: get-managed-content
              method: GET
              description: "Get a specific managed content item."
              inputParameters:
                - name: managedContentId
                  in: path
                  type: string
                  required: true
                  description: "Managed content ID."
              outputRawFormat: json
              outputParameters:
                - name: content
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8110
      namespace: cms-managed-content-api
      resources:
        - path: /v1/cms/channels
          name: channels
          operations:
            - method: GET
              name: list-delivery-channels
              description: "List CMS managed content delivery channels."
              call: "cms-managed-content.list-delivery-channels"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cms/contents
          name: cms-content
          operations:
            - method: GET
              name: search-managed-content
              description: "Search managed content across CMS workspaces."
              call: "cms-managed-content.search-managed-content"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9110
      namespace: cms-managed-content-mcp
      transport: http
      tools:
        - name: list-cms-channels
          description: "List managed content delivery channels for Experience Cloud sites."
          hints:
            readOnly: true
            idempotent: true
          call: "cms-managed-content.list-delivery-channels"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-cms-content
          description: "Search published managed content across CMS workspaces."
          hints:
            readOnly: true
            idempotent: true
          call: "cms-managed-content.search-managed-content"
          with:
            managedContentType: "tools.managedContentType"
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-cms-content
          description: "Get a specific managed content item by ID."
          hints:
            readOnly: true
            idempotent: true
          call: "cms-managed-content.get-managed-content"
          with:
            managedContentId: "tools.managedContentId"
          outputParameters:
            - type: object
              mapping: "$."
