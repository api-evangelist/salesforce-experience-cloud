naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce CMS Delivery API"
  description: >-
    Delivers CMS content to external applications and headless frontends.
    Enables content retrieval by delivery channel, content type, and content
    key for building decoupled digital experiences.
  tags:
    - CMS
    - Content Delivery
    - Digital Experiences
    - Headless CMS
    - Salesforce Experience Cloud
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: cms-delivery
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0/connect/cms/delivery"
      description: "Salesforce CMS Delivery API for headless content retrieval."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: channels
          path: /channels
          description: "CMS content delivery channels."
          operations:
            - name: list-delivery-channels
              method: GET
              description: "List available managed content delivery channels."
              outputRawFormat: json
              outputParameters:
                - name: channels
                  type: object
                  value: "$."
            - name: get-delivery-channel
              method: GET
              description: "Get details of a specific delivery channel."
              inputParameters:
                - name: channelId
                  in: path
                  type: string
                  required: true
                  description: "Delivery channel ID."
              outputRawFormat: json
              outputParameters:
                - name: channel
                  type: object
                  value: "$."
            - name: query-channel-content
              method: GET
              description: "Query content from a delivery channel."
              inputParameters:
                - name: channelId
                  in: path
                  type: string
                  required: true
                  description: "Delivery channel ID."
                - name: managedContentType
                  in: query
                  type: string
                  required: true
                  description: "Developer name of the content type."
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "Language code for content variant."
              outputRawFormat: json
              outputParameters:
                - name: content
                  type: object
                  value: "$."

        - name: content-delivery
          path: /channels/{channelId}/contents/query
          description: "Headless content delivery by channel."
          operations:
            - name: query-delivery-content
              method: GET
              description: "Retrieve published CMS content from a delivery channel."
              inputParameters:
                - name: channelId
                  in: path
                  type: string
                  required: true
                  description: "Delivery channel ID."
                - name: managedContentType
                  in: query
                  type: string
                  required: true
                  description: "Content type developer name."
                - name: contentKeys
                  in: query
                  type: string
                  required: false
                  description: "Comma-separated content keys."
              outputRawFormat: json
              outputParameters:
                - name: contentItems
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8109
      namespace: cms-delivery-api
      resources:
        - path: /v1/cms/delivery/channels
          name: channels
          operations:
            - method: GET
              name: list-delivery-channels
              description: "List CMS delivery channels."
              call: "cms-delivery.list-delivery-channels"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cms/delivery/channels/{channelId}/content
          name: content
          operations:
            - method: GET
              name: query-delivery-content
              description: "Retrieve CMS content from a delivery channel."
              call: "cms-delivery.query-delivery-content"
              with:
                channelId: "rest.channelId"
                managedContentType: "rest.managedContentType"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9109
      namespace: cms-delivery-mcp
      transport: http
      tools:
        - name: list-cms-delivery-channels
          description: "List all CMS content delivery channels for Experience Cloud sites."
          hints:
            readOnly: true
            idempotent: true
          call: "cms-delivery.list-delivery-channels"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-cms-delivery-channel
          description: "Get details of a specific CMS delivery channel."
          hints:
            readOnly: true
            idempotent: true
          call: "cms-delivery.get-delivery-channel"
          with:
            channelId: "tools.channelId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-cms-delivery-content
          description: "Retrieve published CMS content from a delivery channel for headless frontends."
          hints:
            readOnly: true
            idempotent: true
          call: "cms-delivery.query-delivery-content"
          with:
            channelId: "tools.channelId"
            managedContentType: "tools.managedContentType"
          outputParameters:
            - type: object
              mapping: "$."
