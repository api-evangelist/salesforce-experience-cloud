naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Experience Cloud Connect Communities API"
  description: >-
    API for community feeds, topics, and user engagement within Salesforce
    Experience Cloud. Manage social feeds, comments, likes, topics, and members.
  tags:
    - Chatter
    - Communities
    - Feeds
    - Salesforce Experience Cloud
    - Social
    - Topics
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: exp-cloud-communities
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0/connect/communities"
      description: "Salesforce Experience Cloud Connect Communities REST API."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: feeds
          path: /{communityId}/chatter/feeds/news
          description: "Community news feeds."
          operations:
            - name: get-news-feed
              method: GET
              description: "Get the news feed for a community."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: feed
                  type: object
                  value: "$."
            - name: post-feed-element
              method: POST
              description: "Post a feed element (text post, link, question)."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: feedElement
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  body:
                    messageSegments: "{{tools.messageSegments}}"
                  feedElementType: "{{tools.feedElementType}}"

        - name: topics
          path: /{communityId}/chatter/topics
          description: "Community topics."
          operations:
            - name: list-topics
              method: GET
              description: "List topics in a community."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: topics
                  type: object
                  value: "$."
            - name: create-topic
              method: POST
              description: "Create a new community topic."
              inputParameters:
                - name: communityId
                  in: path
                  type: string
                  required: true
                  description: "Community ID."
              outputRawFormat: json
              outputParameters:
                - name: topic
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"

  exposes:
    - type: rest
      port: 8107
      namespace: exp-cloud-communities-api
      resources:
        - path: /v1/communities/{communityId}/feed
          name: community-feed
          operations:
            - method: GET
              name: get-news-feed
              description: "Get community news feed."
              call: "exp-cloud-communities.get-news-feed"
              with:
                communityId: "rest.communityId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/communities/{communityId}/topics
          name: community-topics
          operations:
            - method: GET
              name: list-topics
              description: "List community topics."
              call: "exp-cloud-communities.list-topics"
              with:
                communityId: "rest.communityId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9107
      namespace: exp-cloud-communities-mcp
      transport: http
      tools:
        - name: get-community-feed
          description: "Get the news feed for an Experience Cloud community."
          hints:
            readOnly: true
            idempotent: true
          call: "exp-cloud-communities.get-news-feed"
          with:
            communityId: "tools.communityId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: post-to-community-feed
          description: "Post a message or content to an Experience Cloud community feed."
          hints:
            readOnly: false
            destructive: false
          call: "exp-cloud-communities.post-feed-element"
          with:
            communityId: "tools.communityId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-community-topics
          description: "List topics in an Experience Cloud community."
          hints:
            readOnly: true
            idempotent: true
          call: "exp-cloud-communities.list-topics"
          with:
            communityId: "tools.communityId"
          outputParameters:
            - type: object
              mapping: "$."
