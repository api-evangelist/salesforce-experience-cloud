naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce User Interface API"
  description: >-
    Access record data, layouts, list views, and navigation items for building
    custom user interfaces. Powers Lightning web components in Experience Cloud
    sites with metadata-driven UI rendering. Returns both data and metadata in
    a single response.
  tags:
    - Layouts
    - Lightning
    - Navigation
    - Records
    - Salesforce Experience Cloud
    - User Interface
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: sf-ui-api
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0/ui-api"
      description: "Salesforce User Interface API."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: record-ui
          path: /record-ui
          description: "Record UI data including layouts and field metadata."
          operations:
            - name: get-record-ui
              method: GET
              description: "Get layout, field data, and metadata for one or more records."
              inputParameters:
                - name: recordIds
                  in: path
                  type: string
                  required: true
                  description: "One or more record IDs (comma-separated)."
                - name: formFactor
                  in: query
                  type: string
                  required: false
                  description: "Form factor (Large, Medium, Small)."
                - name: layoutTypes
                  in: query
                  type: string
                  required: false
                  description: "Comma-separated layout types to return."
              outputRawFormat: json
              outputParameters:
                - name: recordUi
                  type: object
                  value: "$."

        - name: records
          path: /records
          description: "Record CRUD operations with UI metadata."
          operations:
            - name: get-record
              method: GET
              description: "Get a record with field values and UI metadata."
              inputParameters:
                - name: recordId
                  in: path
                  type: string
                  required: true
                  description: "Record ID."
              outputRawFormat: json
              outputParameters:
                - name: record
                  type: object
                  value: "$."
            - name: create-record
              method: POST
              description: "Create a new Salesforce record via UI API."
              outputRawFormat: json
              outputParameters:
                - name: record
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  apiName: "{{tools.apiName}}"
                  fields: "{{tools.fields}}"
            - name: update-record
              method: PATCH
              description: "Update a Salesforce record via UI API."
              inputParameters:
                - name: recordId
                  in: path
                  type: string
                  required: true
                  description: "Record ID."
              outputRawFormat: json
              outputParameters:
                - name: record
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  fields: "{{tools.fields}}"

        - name: object-info
          path: /object-info
          description: "Object metadata for UI rendering."
          operations:
            - name: get-object-info
              method: GET
              description: "Get object metadata for a Salesforce object type."
              inputParameters:
                - name: objectApiName
                  in: path
                  type: string
                  required: true
                  description: "Object API name."
              outputRawFormat: json
              outputParameters:
                - name: objectInfo
                  type: object
                  value: "$."

        - name: list-views
          path: /object-info/{objectApiName}/list-views
          description: "List views for Salesforce objects."
          operations:
            - name: get-list-views
              method: GET
              description: "Get list views available for an object."
              inputParameters:
                - name: objectApiName
                  in: path
                  type: string
                  required: true
                  description: "Object API name."
              outputRawFormat: json
              outputParameters:
                - name: listViews
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8113
      namespace: sf-ui-api-exposed
      resources:
        - path: /v1/record-ui/{recordIds}
          name: record-ui
          operations:
            - method: GET
              name: get-record-ui
              description: "Get record UI with layout and field data."
              call: "sf-ui-api.get-record-ui"
              with:
                recordIds: "rest.recordIds"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/records
          name: records
          operations:
            - method: POST
              name: create-record
              description: "Create a Salesforce record via UI API."
              call: "sf-ui-api.create-record"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/object-info/{objectApiName}
          name: object-info
          operations:
            - method: GET
              name: get-object-info
              description: "Get UI metadata for a Salesforce object."
              call: "sf-ui-api.get-object-info"
              with:
                objectApiName: "rest.objectApiName"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9113
      namespace: sf-ui-api-mcp
      transport: http
      tools:
        - name: get-record-ui
          description: "Get layout information, field data, and metadata for Salesforce records."
          hints:
            readOnly: true
            idempotent: true
          call: "sf-ui-api.get-record-ui"
          with:
            recordIds: "tools.recordIds"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-object-info
          description: "Get UI metadata for a Salesforce object type for building custom interfaces."
          hints:
            readOnly: true
            idempotent: true
          call: "sf-ui-api.get-object-info"
          with:
            objectApiName: "tools.objectApiName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-list-views
          description: "Get available list views for a Salesforce object."
          hints:
            readOnly: true
            idempotent: true
          call: "sf-ui-api.get-list-views"
          with:
            objectApiName: "tools.objectApiName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-salesforce-record
          description: "Create a new Salesforce record via the UI API."
          hints:
            readOnly: false
            destructive: false
          call: "sf-ui-api.create-record"
          outputParameters:
            - type: object
              mapping: "$."
