naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce GraphQL API"
  description: >-
    Query Salesforce data using GraphQL for Experience Cloud. Offers a flexible
    query language for retrieving exactly the data needed, reducing over-fetching
    and improving performance for digital experiences. Supports queries and
    mutations against the UIAPI schema.
  tags:
    - Data
    - Digital Experiences
    - GraphQL
    - Performance
    - Query
    - Salesforce Experience Cloud
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_OAUTH2_TOKEN: SALESFORCE_OAUTH2_TOKEN
      SALESFORCE_INSTANCE_URL: SALESFORCE_INSTANCE_URL

capability:
  consumes:
    - type: http
      namespace: sf-graphql
      baseUri: "{{env.SALESFORCE_INSTANCE_URL}}/services/data/v59.0"
      description: "Salesforce GraphQL API for Experience Cloud data access."
      authentication:
        type: bearer
        token: "{{env.SALESFORCE_OAUTH2_TOKEN}}"
      resources:
        - name: graphql
          path: /graphql
          description: "GraphQL endpoint for flexible Salesforce data queries."
          operations:
            - name: execute-graphql
              method: POST
              description: "Execute a GraphQL query or mutation against the Salesforce UIAPI schema."
              outputRawFormat: json
              outputParameters:
                - name: data
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  query: "{{tools.query}}"
                  variables: "{{tools.variables}}"
                  operationName: "{{tools.operationName}}"

  exposes:
    - type: rest
      port: 8112
      namespace: sf-graphql-api
      resources:
        - path: /v1/graphql
          name: graphql
          operations:
            - method: POST
              name: execute-graphql
              description: "Execute a GraphQL query or mutation against Salesforce."
              call: "sf-graphql.execute-graphql"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9112
      namespace: sf-graphql-mcp
      transport: http
      tools:
        - name: execute-graphql-query
          description: "Execute a GraphQL query or mutation against Salesforce UIAPI schema for Experience Cloud."
          hints:
            readOnly: true
            idempotent: true
          call: "sf-graphql.execute-graphql"
          with:
            query: "tools.query"
            variables: "tools.variables"
          outputParameters:
            - type: object
              mapping: "$."
