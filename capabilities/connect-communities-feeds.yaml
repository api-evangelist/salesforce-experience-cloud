        description: Salesforce Experience Cloud Get Comments on a Feed Element
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postcomment
        method: POST
        description: Salesforce Experience Cloud Post a Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: communities-communityId-chatter-feeds-news-me-feed-elements
      path: /communities/{communityId}/chatter/feeds/news/me/feed-elements
      operations:
