naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce REST API — Resources
  description: 'Salesforce Experience Cloud Salesforce REST API — Resources. 1 operations. Lead operation: Salesforce Experience
    Cloud List Available Resources. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-resources
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Salesforce REST API — Resources business capability. Self-contained, no shared
      references.
    resources:
    - name: root
      path: /
      operations:
      - name: listresources
        method: GET
        description: Salesforce Experience Cloud List Available Resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-resources-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce REST API — Resources. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: listresources
        description: Salesforce Experience Cloud List Available Resources
        call: rest-resources.listresources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce REST API — Resources. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-list-available
      description: Salesforce Experience Cloud List Available Resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-resources.listresources
      outputParameters:
      - type: object
        mapping: $.
