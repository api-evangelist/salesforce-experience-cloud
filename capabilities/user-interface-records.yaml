    resources:
    - name: record-ui-recordIds
      path: /record-ui/{recordIds}
      operations:
      - name: getrecordui
        method: GET
        description: Salesforce Experience Cloud Get Record UI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: recordIds
          in: path
          type: string
          description: One or more record IDs (comma-separated for multiple records, up to 200)
          required: true
        - name: childRelationships
          in: query
          type: string
          description: Comma-separated list of child relationship names to include
        - name: formFactor
          in: query
          type: string
          description: Form factor for the layout
        - name: layoutTypes
          in: query
          type: string
          description: Comma-separated layout types to return
        - name: modes
          in: query
          type: string
          description: Comma-separated modes for the layout
        - name: optionalFields
          in: query
          type: string
          description: Comma-separated list of optional fields to include
    - name: records
      path: /records
      operations:
      - name: createrecord
        method: POST
        description: Salesforce Experience Cloud Create a Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: records-recordId
      path: /records/{recordId}
      operations:
      - name: getrecord
        method: GET
        description: Salesforce Experience Cloud Get a Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: Comma-separated list of field API names to return
        - name: layoutTypes
          in: query
          type: string
          description: Layout type whose fields to include
        - name: modes
          in: query
          type: string
          description: Layout mode
        - name: optionalFields
          in: query
          type: string
          description: Optional fields to include if accessible
      - name: updaterecord
        method: PATCH
        description: Salesforce Experience Cloud Update a Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleterecord
        method: DELETE
        description: Salesforce Experience Cloud Delete a Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
