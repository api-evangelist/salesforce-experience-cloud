naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce REST API — Search
  description: 'Salesforce Experience Cloud Salesforce REST API — Search. 1 operations. Lead operation: Salesforce Experience
    Cloud Execute a SOSL Search. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-search
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Salesforce REST API — Search business capability. Self-contained, no shared references.
    resources:
    - name: search
      path: /search
      operations:
      - name: executesearch
        method: GET
        description: Salesforce Experience Cloud Execute a SOSL Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The SOSL search string to execute
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-search-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce REST API — Search. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: executesearch
        description: Salesforce Experience Cloud Execute a SOSL Search
        call: rest-search.executesearch
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce REST API — Search. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-execute-sosl
      description: Salesforce Experience Cloud Execute a SOSL Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.executesearch
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
