naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Salesforce REST API — Limits
  description: 'Salesforce Experience Cloud Salesforce REST API — Limits. 1 operations. Lead operation: Salesforce Experience
    Cloud Get Org Limits. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Limits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-limits
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Salesforce REST API — Limits business capability. Self-contained, no shared references.
    resources:
    - name: limits
      path: /limits
      operations:
      - name: getlimits
        method: GET
        description: Salesforce Experience Cloud Get Org Limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-limits-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Salesforce REST API — Limits. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/limits
      name: limits
      description: REST surface for limits.
      operations:
      - method: GET
        name: getlimits
        description: Salesforce Experience Cloud Get Org Limits
        call: rest-limits.getlimits
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-limits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Salesforce REST API — Limits. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-get-org
      description: Salesforce Experience Cloud Get Org Limits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-limits.getlimits
      outputParameters:
      - type: object
        mapping: $.
