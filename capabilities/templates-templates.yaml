naftiko: 1.0.0-alpha2
info:
  label: Salesforce Experience Cloud Templates API — Templates
  description: 'Salesforce Experience Cloud Templates API — Templates. 2 operations. Lead operation: Salesforce Experience
    Cloud List Site Templates. Self-contained Naftiko capability covering one Salesforce Experience Cloud business surface.'
  tags:
  - Salesforce Experience Cloud
  - Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_EXPERIENCE_CLOUD_API_KEY: SALESFORCE_EXPERIENCE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: templates-templates
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Experience Cloud Templates API — Templates business capability. Self-contained, no shared references.
    resources:
    - name: connect-communities-templates
      path: /connect/communities/templates
      operations:
      - name: listsitetemplates
        method: GET
        description: Salesforce Experience Cloud List Site Templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: templateCategory
          in: query
          type: string
          description: Filter templates by category
    - name: connect-communities-communityId-template
      path: /connect/communities/{communityId}/template
      operations:
      - name: getsitetemplate
        method: GET
        description: Salesforce Experience Cloud Get Site Template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_EXPERIENCE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: templates-templates-rest
    port: 8080
    description: REST adapter for Salesforce Experience Cloud Templates API — Templates. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/connect/communities/templates
      name: connect-communities-templates
      description: REST surface for connect-communities-templates.
      operations:
      - method: GET
        name: listsitetemplates
        description: Salesforce Experience Cloud List Site Templates
        call: templates-templates.listsitetemplates
        with:
          templateCategory: rest.templateCategory
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connect/communities/{communityid}/template
      name: connect-communities-communityid-template
      description: REST surface for connect-communities-communityId-template.
      operations:
      - method: GET
        name: getsitetemplate
        description: Salesforce Experience Cloud Get Site Template
        call: templates-templates.getsitetemplate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: templates-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Experience Cloud Templates API — Templates. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-experience-cloud-list-site
      description: Salesforce Experience Cloud List Site Templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: templates-templates.listsitetemplates
      with:
        templateCategory: tools.templateCategory
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-experience-cloud-get-site
      description: Salesforce Experience Cloud Get Site Template
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: templates-templates.getsitetemplate
      outputParameters:
      - type: object
        mapping: $.
