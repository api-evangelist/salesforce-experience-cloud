openapi: 3.2.0
info:
  title: Salesforce Experience Cloud Salesforce Connect REST API…
  description: Access community data, feeds, topics, and user engagement features. The Connect REST API provides endpoints for social collaboration, content sharing, and community management within Experience Cloud sites. Includes feed operations, topic management, and member engagement.
  version: 59.0.0
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Master Subscription Agreement
    url: https://www.salesforce.com/company/legal/sfdc-website-terms-of-service/
servers:
- url: https://{instance}.salesforce.com/services/data/v59.0/connect
  description: Salesforce Instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance name or custom domain
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Knowledge
  description: Knowledge article operations within communities
paths:
  /communities/{communityId}/managed-content/delivery:
    get:
      operationId: getKnowledgeArticles
      summary: Salesforce Experience Cloud Get Knowledge Articles
      description: Returns knowledge articles published to the specified Experience Cloud site. Supports filtering by category and language.
      tags:
      - Knowledge
      parameters:
      - $ref: '#/components/parameters/CommunityId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageToken'
      - name: language
        in: query
        description: Language code to filter articles
        schema:
          type: string
      - name: managedContentType
        in: query
        description: Content type to filter by
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved knowledge articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentDeliveryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: Number of items to return per page (default 25, max 100)
      schema:
        type: integer
        default: 25
        maximum: 100
    CommunityId:
      name: communityId
      in: path
      required: true
      description: The ID of the Experience Cloud site (community)
      schema:
        type: string
    PageToken:
      name: pageToken
      in: query
      description: Token for retrieving the next page of results
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - invalid or expired OAuth token
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ManagedContentDeliveryPage:
      type: object
      description: Paginated managed content delivery results
      properties:
        currentPageUrl:
          type: string
          format: uri
        items:
          type: array
          items:
            type: object
            properties:
              contentKey:
                type: string
              contentUrlName:
                type: string
              language:
                type: string
              managedContentId:
                type: string
              publishedDate:
                type: string
                format: date-time
              title:
                type: string
              type:
                type: string
              typeLabel:
                type: string
        nextPageUrl:
          type: string
          format: uri
        totalCount:
          type: integer
    ErrorResponse:
      type: object
      description: Standard Salesforce API error response
      properties:
        errorCode:
          type: string
          description: Salesforce error code
        message:
          type: string
          description: Human-readable error message
  securitySchemes:
    oauth2:
      type: oauth2
      description: Salesforce OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your data
            chatter_api: Manage Chatter data
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
      description: Bearer token obtained through OAuth 2.0 flow
